name: RolePoint
description: RolePoint was an employee referral, internal mobility, and talent-acquisition
  software company that helped recruitment teams source, refer, and redeploy talent
  through referral programs and internal mobility marketplaces, with a "Connect" API
  layer for integrating into ATS/HRIS systems such as iCIMS. The company was acquired
  by Jobvite in 2019 and folded into the Jobvite Talent Acquisition Suite; the standalone
  rolepoint.com domain no longer resolves and no independent developer portal or API
  surface remains reachable. It is tracked here as a 500 Global portfolio company.
